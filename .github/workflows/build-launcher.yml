name: build-launcher

on:
  push:
    paths:
      - 'launcher-cpp/**'
      - '.github/workflows/build-launcher.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: launcher-cpp
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Compile resources
        run: rc /nologo app.rc
      - name: Compile
        run: cl /nologo /EHsc /O2 /utf-8 /DUNICODE /D_UNICODE /FeEtherealLauncher.exe src\main.cpp app.res wininet.lib gdi32.lib msimg32.lib crypt32.lib iphlpapi.lib shell32.lib ole32.lib uuid.lib winmm.lib
      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: EtherealLauncher-win64
          path: launcher-cpp/EtherealLauncher.exe

  release:
    if: startsWith(github.ref, 'refs/tags/cpp-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: EtherealLauncher-win64
          path: rel
      - uses: softprops/action-gh-release@v2
        with:
          files: rel/EtherealLauncher.exe
          generate_release_notes: true
